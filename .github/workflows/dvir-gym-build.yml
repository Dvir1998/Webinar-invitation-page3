name: Dvir Gym AI Production Bundle

on:
  push:
    branches: [main, athlete-os-9-3-fix]
    paths:
      - 'gym/code/**'
      - 'gym/assets/**'
      - '.github/workflows/dvir-gym-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dvir-gym-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build deterministic production bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gym/dist

          printf '/* Dvir Gym AI Athlete OS — generated production CSS. Do not edit directly. */\n' > gym/dist/app.css
          while IFS= read -r f; do
            echo "Bundling $f"
            cat "$f" >> gym/dist/app.css
          done < <(printf '%s\n' gym/code/css*.txt | sort -V)

          printf '/* Dvir Gym AI Athlete OS — generated production JS. Do not edit directly. */\n' > gym/dist/app.js
          while IFS= read -r f; do
            echo "Bundling $f"
            cat "$f" >> gym/dist/app.js
          done < <(printf '%s\n' gym/code/js*.txt | sort -V)

          BUILD_ID="$GITHUB_SHA" node - <<'NODE'
          const fs=require('fs');
          const p='gym/dist/app.js';
          let s=fs.readFileSync(p,'utf8');
          // Normalize one source typo caught by the production syntax gate in the 9.3 gallery handler.
          const bad=")}};$('#machineDialog').showModal();dgUnlockDocumentScrollV93()";
          const good=")};$('#machineDialog').showModal();dgUnlockDocumentScrollV93()";
          if(s.includes(bad)) s=s.replace(bad,good);
          const marker="'use strict';";
          if(!s.includes(marker)) throw new Error('strict marker missing');
          s=s.replace(marker, marker+"\nconst DG_BUILD_ID='"+process.env.BUILD_ID+"';");
          fs.writeFileSync(p,s);
          NODE

          node --check gym/dist/app.js
          grep -q 'Athlete OS 9.3.1 — iPhone-safe single-scroller contract' gym/dist/app.css
          grep -q 'DG_GYM_ATLAS_COMPLETE_V931=false' gym/dist/app.js
          grep -q 'dgValidateAtlasV931' gym/dist/app.js
          grep -q 'Multi-provider AI' gym/dist/app.js
          grep -q 'DG_RECOVERY_LOGIC_V931' gym/dist/app.js
          grep -q 'DG_GYM_PHOTO_LIBRARY_READY_V94=true' gym/dist/app.js
          grep -q 'DG_GYM_PHOTO_TOTAL_V94' gym/dist/app.js
          grep -q 'DG_AI_UX_VERSION_V941' gym/dist/app.js
          grep -q 'dgProviderErrorV941' gym/dist/app.js
          grep -q 'DG_CHAT_TOOLS_V95' gym/dist/app.js
          grep -q 'Athlete OS 9.4 — native high-resolution machine photography' gym/dist/app.css
          grep -q 'Athlete OS 9.4.1 — direct Gemini setup and persistent diagnostics' gym/dist/app.css
          grep -q 'Athlete OS 9.5 — compact, touch-safe chat history controls' gym/dist/app.css
          grep -q 'Athlete OS 9.6 — premium coach canvas and verified light-theme contrast' gym/dist/app.css
          grep -q 'DG_COACH_PREMIUM_V96' gym/dist/app.js
          grep -q 'non-blocking release banner' gym/dist/app.css
          test -s gym/assets/gym-machines-2x.webp
          test -s gym/assets/gym-photos/manifest.json
          test "$(find gym/assets/gym-photos/source -type f -name '*.png' | wc -l | tr -d ' ')" = '32'
          test "$(find gym/assets/gym-photos/full -type f -name '*.webp' | wc -l | tr -d ' ')" = '32'
          test "$(find gym/assets/gym-photos/thumb -type f -name '*.webp' | wc -l | tr -d ' ')" = '32'

          printf '%s\n' "$(sha256sum gym/dist/app.js | cut -d' ' -f1)  app.js" "$(sha256sum gym/dist/app.css | cut -d' ' -f1)  app.css" > gym/dist/SHA256SUMS
          printf '{"build":"%s","builtAt":"%s","channel":"production","appVersion":"9.3.1"}\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > gym/version.json
      - name: Commit bundle when changed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- gym/dist gym/version.json)" ]; then
            echo 'Bundle already current'
            exit 0
          fi
          git config user.name 'dvir-gym-build-bot'
          git config user.email '156288344+Dvir1998@users.noreply.github.com'
          git add gym/dist gym/version.json
          git commit -m 'build: refresh Dvir Gym AI production bundle [skip ci]'
          git push
