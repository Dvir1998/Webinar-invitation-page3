name: Dvir Gym AI Zero-Cost QA

on:
  push:
    branches: [main]
    paths:
      - 'gym/**'
      - '.github/workflows/dvir-gym-zero-cost-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-athlete-os:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify production bundle and PWA files
        shell: bash
        run: |
          set -euo pipefail
          test -f .nojekyll
          test -f gym/index.html
          test -f gym/manifest.json
          test -f gym/sw.js
          test -f gym/dist/app.js
          test -f gym/dist/app.css
          test -f gym/dist/SHA256SUMS
          test -f gym/tests/e2e.mjs
          for i in $(seq 1 7); do test -f "gym/assets/sprite${i}.txt"; done
          grep -q 'dist/app.css?v=7.6.0' gym/index.html
          grep -q 'dist/app.js?v=7.6.0' gym/index.html
          grep -q 'v7-6-0' gym/sw.js
          grep -q "'dist/app.css'" gym/sw.js
          grep -q "'dist/app.js'" gym/sw.js
          (cd gym/dist && sha256sum -c SHA256SUMS)
      - name: JavaScript and manifest syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --check gym/dist/app.js
          node --check gym/sw.js
          node --check gym/tests/e2e.mjs
          node -e "JSON.parse(require('fs').readFileSync('gym/manifest.json','utf8')); console.log('manifest ok')"
      - name: Enforce zero-cost, privacy, coaching and UI policy
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'api\.openai\.com|platform\.openai\.com' gym/index.html gym/dist gym/sw.js; then
            echo 'Paid OpenAI path found in production artifacts'
            exit 1
          fi
          grep -q 'openrouter/free' gym/dist/app.js
          grep -q 'ZERO COST\|Zero.Cost' gym/dist/app.js
          grep -q 'code_challenge_method=S256' gym/dist/app.js
          grep -q 'oauth-exchange' gym/dist/app.js
          grep -q 'DG_VAPID_PUBLIC' gym/dist/app.js
          grep -q 'DG_PRIVACY_URL' gym/dist/app.js
          grep -q 'Plateau detected' gym/dist/app.js
          grep -q 'DG_FOOD_URL' gym/dist/app.js
          grep -q 'Open Food Facts' gym/dist/app.js
          grep -q 'TECHNIQUE SNAPSHOT' gym/dist/app.js
          grep -q 'תמונה סטטית אחת בלבד' gym/dist/app.js
          grep -q 'Bright Glass' gym/dist/app.js
          grep -q 'dvirGymThemeV1' gym/dist/app.js
          grep -q 'grid-template-columns:repeat(5,minmax(0,1fr))' gym/dist/app.css
          grep -q 'data-dg-theme="bright"' gym/dist/app.css
          grep -q "addEventListener('push'" gym/sw.js
      - name: Verify cloud services are alive and free-only
        shell: bash
        run: |
          set -euo pipefail
          COACH=$(curl --fail --silent --show-error --max-time 25 'https://rufnflwelexnpgzpzzfq.supabase.co/functions/v1/coach')
          MEMORY=$(curl --fail --silent --show-error --max-time 25 'https://rufnflwelexnpgzpzzfq.supabase.co/functions/v1/cloud-memory')
          SETUP=$(curl --fail --silent --show-error --max-time 25 'https://rufnflwelexnpgzpzzfq.supabase.co/functions/v1/ai-key-setup')
          PUSH_SUB=$(curl --fail --silent --show-error --max-time 25 'https://rufnflwelexnpgzpzzfq.supabase.co/functions/v1/push-subscribe')
          PUSH_DISP=$(curl --fail --silent --show-error --max-time 25 'https://rufnflwelexnpgzpzzfq.supabase.co/functions/v1/push-dispatch')
          PRIVACY=$(curl --fail --silent --show-error --max-time 25 'https://rufnflwelexnpgzpzzfq.supabase.co/functions/v1/privacy-control')
          FOOD=$(curl --fail --silent --show-error --max-time 25 'https://rufnflwelexnpgzpzzfq.supabase.co/functions/v1/food-lookup')
          echo "$COACH" | grep -q '"freeOnly":true'
          echo "$COACH" | grep -q '"model":"openrouter/free"'
          echo "$COACH" | grep -q '"originLocked":true'
          echo "$MEMORY" | grep -q '"conflictDetection":true'
          echo "$SETUP" | grep -q '"mode":"free-only"'
          echo "$SETUP" | grep -q '"oauth":"pkce"'
          echo "$SETUP" | grep -q '"originLocked":true'
          echo "$PUSH_SUB" | grep -q '"ok":true'
          echo "$PUSH_DISP" | grep -q '"ok":true'
          echo "$PRIVACY" | grep -q '"ok":true'
          echo "$FOOD" | grep -q '"zeroCost":true'
          echo "$FOOD" | grep -q 'Open Food Facts v3'
