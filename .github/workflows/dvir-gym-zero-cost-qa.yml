name: Dvir Gym AI Zero-Cost QA

on:
  push:
    branches: [main]
    paths:
      - 'gym/**'
      - '.github/workflows/dvir-gym-zero-cost-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-athlete-os:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify Athlete OS 9.3.1 production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f .nojekyll
          for p in gym/index.html gym/recover.html gym/manifest.json gym/sw.js gym/version.json gym/dist/app.js gym/dist/app.css gym/dist/SHA256SUMS gym/code/css19.txt gym/code/css20.txt gym/code/js47.txt gym/code/js48.txt gym/assets/gym-machines.webp; do test -f "$p"; done
          node --check gym/dist/app.js
          node --check gym/sw.js
          node -e "const x=JSON.parse(require('fs').readFileSync('gym/version.json','utf8'));if(!x.build||x.appVersion!=='9.3.1')process.exit(1);console.log('version',x.appVersion,x.build)"
          node -e "const x=JSON.parse(require('fs').readFileSync('gym/manifest.json','utf8'));if(!x.name.includes('9.3.1'))process.exit(1);console.log('manifest ok')"
          node - <<'NODE'
          const fs=require('fs');
          const p='gym/assets/gym-machines.webp',x=fs.readFileSync(p);
          if(x.length<20000||x.slice(0,4).toString()!=='RIFF'||x.slice(8,12).toString()!=='WEBP')throw new Error('verified gym photo sprite invalid');
          const declared=x.readUInt32LE(4)+8;if(declared!==x.length)throw new Error(`partial gym photo sprite ${x.length}/${declared}`);
          console.log('verified gym photo sprite ok',x.length);
          NODE
          grep -q 'Athlete OS 9.3.1 — iPhone-safe single-scroller contract' gym/dist/app.css
          grep -q 'body{height:auto!important' gym/dist/app.css
          grep -q 'overflow:visible!important' gym/dist/app.css
          grep -q 'DG_GYM_ATLAS_COMPLETE_V931=false' gym/dist/app.js
          grep -q 'dgValidateAtlasV931' gym/dist/app.js
          grep -q '20 תמונות תקינות' gym/dist/app.js
          grep -q 'DG_RECOVERY_LOGIC_V931' gym/dist/app.js
          grep -q "'leg-press'" gym/dist/app.js
          grep -q "'biceps-curl'" gym/dist/app.js
          grep -q "'treadmill'" gym/dist/app.js
          grep -q "'elliptical'" gym/dist/app.js
          grep -q "'stair'" gym/dist/app.js
          grep -q "'recumbent'" gym/dist/app.js
          grep -q "'rower'" gym/dist/app.js
          grep -q "'bike'" gym/dist/app.js
          grep -q 'MULTI‑PROVIDER COACH' gym/dist/app.js
          grep -q 'Gemini' gym/dist/app.js
          grep -q 'OpenRouter' gym/dist/app.js
          grep -q 'providerPreference' gym/dist/app.js
          grep -q 'Memory Engine המקומי' gym/dist/app.js
          grep -q 'dvir-athlete-os-v9-3-1-iphone-scroll-20260827' gym/sw.js
          grep -q "'assets/gym-machines.webp'" gym/sw.js
          if grep -q 'gym-new-v93-tiny' gym/sw.js; then echo 'partial atlas must not be cached'; exit 1; fi
          grep -q "cache:'reload'" gym/sw.js
          grep -q 'dist/app.js?b=' gym/index.html
          grep -q 'dvirGymBootGuardV922' gym/index.html
          (cd gym/dist && sha256sum -c SHA256SUMS)
      - name: Verify identity privacy and zero-cost infrastructure contract
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'api\.openai\.com|platform\.openai\.com' gym/index.html gym/dist gym/sw.js; then
            echo 'Unexpected paid OpenAI path found in production artifacts'; exit 1
          fi
          for token in DG_BUILD_ID DG_ACCOUNT_URL DG_USER_MEMORY_URL DG_USER_AI_URL DG_USER_COACH_URL DG_USER_PUSH_URL DG_USER_PRIVACY_URL dvirAthleteOS_v8:: dgIdentityTransition dgPhotoScope 'זכור אותי במכשיר הזה' 'שינוי סיסמה מאובטח' 'תמונת הפרופיל שלך' 'Admin Studio' 'שיתוף עם מנהל האפליקציה' 'Theme Studio' 'Ivory Cream' 'Gold · White · Rose' 'Aurora Fusion' 'Recovery Key' 'home-pushup' 'home-legraise' 'Bulgarian Split Squat'; do grep -q "$token" gym/dist/app.js; done
          grep -q 'dg-home-technique-card' gym/dist/app.css
          grep -q 'dg-machine-gallery-v93' gym/dist/app.css
          grep -q 'dg-ai-studio-v93' gym/dist/app.css
          grep -q 'data-dg-theme="cream"' gym/dist/app.css
          grep -q 'data-dg-theme="pearl"' gym/dist/app.css
          grep -q 'data-dg-theme="aurora"' gym/dist/app.css
          grep -q 'לא מוחקים נתונים אישיים' gym/recover.html
      - name: Verify Supabase services and protection
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rufnflwelexnpgzpzzfq.supabase.co/functions/v1'
          PUB='sb_publishable_10fnqdDQENO2LonzYDXIRw_kQ1q1utk'
          ACCOUNT=$(curl --fail --silent --show-error --max-time 25 "$BASE/account-auth")
          echo "$ACCOUNT" | grep -q '"zeroCost":true'
          echo "$ACCOUNT" | grep -q '"userIsolation":true'
          CONFIG=$(curl --fail --silent --show-error --max-time 25 "$BASE/app-config")
          echo "$CONFIG" | grep -q '"ok":true'
          for fn in user-memory user-ai-key user-coach user-push user-privacy user-account user-photos admin-control admin-experience; do
            CODE=$(curl --silent --max-time 25 -o /tmp/dg-protected.json -w '%{http_code}' -X POST -H "apikey: $PUB" -H 'Content-Type: application/json' --data '{}' "$BASE/$fn")
            test "$CODE" = '401'
          done
