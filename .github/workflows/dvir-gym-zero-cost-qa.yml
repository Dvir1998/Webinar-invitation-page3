name: Dvir Gym AI Zero-Cost QA

on:
  push:
    branches: [main]
    paths:
      - 'gym/**'
      - '.github/workflows/dvir-gym-zero-cost-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-athlete-os:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify production bundle and PWA files
        shell: bash
        run: |
          set -euo pipefail
          test -f .nojekyll
          test -f gym/index.html
          test -f gym/manifest.json
          test -f gym/sw.js
          test -f gym/version.json
          test -f gym/dist/app.js
          test -f gym/dist/app.css
          test -f gym/dist/SHA256SUMS
          test -f gym/tests/e2e.mjs
          test -f gym/tests/multiuser-storage.mjs
          for i in $(seq 1 7); do test -f "gym/assets/sprite${i}.txt"; done
          for i in 1 2; do test -s "gym/assets/home-sprite${i}.txt"; done
          grep -q 'dist/app.css?v=9.0.2' gym/index.html
          grep -q 'dist/app.js?v=9.0.2' gym/index.html
          grep -q 'Athlete OS 9.0.2' gym/index.html
          grep -q 'sessionStorage.getItem(SESSION)' gym/index.html
          grep -q 'dvirGymAuthSessionV8' gym/index.html
          grep -q 'dvirAthleteOS_v8::' gym/index.html
          grep -q 'dvir-athlete-os-v9-0-2-home-visuals-20260816' gym/sw.js
          grep -q "'assets/home-sprite1.txt'" gym/sw.js
          grep -q "'assets/home-sprite2.txt'" gym/sw.js
          grep -q "'version.json'" gym/sw.js
          grep -q '/version.json' gym/sw.js
          grep -q "'dist/app.css'" gym/sw.js
          grep -q "'dist/app.js'" gym/sw.js
          grep -q "'activeScope'" gym/sw.js
          grep -q 'name="referrer" content="no-referrer"' gym/index.html
          node -e "const x=JSON.parse(require('fs').readFileSync('gym/version.json','utf8')); if(!x.build||x.appVersion!=='9.0.2')process.exit(1); console.log('version ok',x.build)"
          node - <<'NODE'
          const fs=require('fs');
          const b=fs.readFileSync('gym/assets/home-sprite1.txt','utf8').trim()+fs.readFileSync('gym/assets/home-sprite2.txt','utf8').trim();
          const x=Buffer.from(b,'base64');
          if(x.length<15000||x.slice(0,4).toString()!=='RIFF'||x.slice(8,12).toString()!=='WEBP') throw new Error('home sprite invalid');
          console.log('home sprite ok',x.length);
          NODE
          (cd gym/dist && sha256sum -c SHA256SUMS)
      - name: JavaScript and manifest syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --check gym/dist/app.js
          node --check gym/sw.js
          node --check gym/tests/e2e.mjs
          node --check gym/tests/multiuser-storage.mjs
          node -e "const x=JSON.parse(require('fs').readFileSync('gym/manifest.json','utf8')); if(!x.name.includes('9.0.2'))process.exit(1); console.log('manifest ok')"
      - name: Enforce zero-cost, multi-user, privacy, themes and coaching policy
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'api\.openai\.com|platform\.openai\.com' gym/index.html gym/dist gym/sw.js; then
            echo 'Paid OpenAI path found in production artifacts'
            exit 1
          fi
          grep -q 'DG_BUILD_ID' gym/dist/app.js
          grep -q 'openrouter/free' gym/dist/app.js
          grep -q 'DG_ACCOUNT_URL' gym/dist/app.js
          grep -q 'DG_USER_MEMORY_URL' gym/dist/app.js
          grep -q 'DG_USER_AI_URL' gym/dist/app.js
          grep -q 'DG_USER_COACH_URL' gym/dist/app.js
          grep -q 'DG_USER_PUSH_URL' gym/dist/app.js
          grep -q 'DG_USER_PRIVACY_URL' gym/dist/app.js
          grep -q 'DG_USER_ACCOUNT_URL' gym/dist/app.js
          grep -q 'DG_USER_PHOTOS_URL' gym/dist/app.js
          grep -q 'DG_ADMIN_CONTROL_URL' gym/dist/app.js
          grep -q 'DG_ADMIN_EXPERIENCE_URL' gym/dist/app.js
          grep -q 'DG_PUBLIC_CONFIG_URL' gym/dist/app.js
          grep -q 'dvirAthleteOS_v8::' gym/dist/app.js
          grep -q 'dgIdentityTransition' gym/dist/app.js
          grep -q 'dgPhotoScope' gym/dist/app.js
          grep -q 'Guest Mode' gym/dist/app.js
          grep -q 'Recovery Key' gym/dist/app.js
          grep -q 'מחק את החשבון לצמיתות' gym/dist/app.js
          grep -q 'זכור אותי במכשיר הזה' gym/dist/app.js
          grep -q 'שינוי סיסמה מאובטח' gym/dist/app.js
          grep -q 'תמונת הפרופיל שלך' gym/dist/app.js
          grep -q 'Admin Studio' gym/dist/app.js
          grep -q 'שיתוף עם מנהל האפליקציה' gym/dist/app.js
          grep -q 'צ׳אט AI ותמונות התקדמות' gym/dist/app.js
          grep -q 'personal-motivation' gym/dist/app.js
          grep -q 'maxConsecutiveStrengthDays:2' gym/dist/app.js
          grep -q 'dgNeedsRecoveryV9' gym/dist/app.js
          grep -q 'Bulgarian Split Squat' gym/dist/app.js
          grep -q 'Standing Dumbbell Calf Raise' gym/dist/app.js
          grep -q 'Incline Smith Press' gym/dist/app.js
          grep -q 'Theme Studio' gym/dist/app.js
          grep -q 'Ivory Cream' gym/dist/app.js
          grep -q 'Gold · White · Rose' gym/dist/app.js
          grep -q 'Aurora Fusion' gym/dist/app.js
          grep -q 'מייסד קהילת Explain' gym/dist/app.js
          grep -q 'דוני (עדן) כהן' gym/dist/app.js
          grep -q 'Multi‑Device Sync' gym/dist/app.js
          grep -q 'user-photos' gym/dist/app.js
          grep -q 'ZERO COST\|Zero.Cost' gym/dist/app.js
          grep -q 'code_challenge_method=S256' gym/dist/app.js
          grep -q 'oauth-exchange' gym/dist/app.js
          grep -q 'DG_VAPID_PUBLIC' gym/dist/app.js
          grep -q 'Plateau detected' gym/dist/app.js
          grep -q 'Open Food Facts' gym/dist/app.js
          grep -q 'TECHNIQUE SNAPSHOT' gym/dist/app.js
          grep -q 'תמונה סטטית אחת בלבד' gym/dist/app.js
          grep -q 'DG_HOME_VISUAL_INDEX' gym/dist/app.js
          grep -q 'AI TECHNIQUE CARD' gym/dist/app.js
          grep -q 'home-sprite1.txt' gym/dist/app.js
          grep -q 'home-pushup' gym/dist/app.js
          grep -q 'home-legraise' gym/dist/app.js
          grep -q 'dg-home-technique-card' gym/dist/app.css
          grep -q 'dg-home-swap-thumb' gym/dist/app.css
          grep -q 'grid-template-columns:repeat(5,minmax(0,1fr))' gym/dist/app.css
          grep -q 'dg-auth-dialog' gym/dist/app.css
          grep -q 'dg-admin-dialog' gym/dist/app.css
          grep -q 'dg-personal-motivation' gym/dist/app.css
          grep -q 'dg-update-banner' gym/dist/app.css
          grep -q 'data-dg-theme="cream"' gym/dist/app.css
          grep -q 'data-dg-theme="pearl"' gym/dist/app.css
          grep -q 'data-dg-theme="aurora"' gym/dist/app.css
          grep -q "addEventListener('push'" gym/sw.js
      - name: Verify public account service and protected user services
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rufnflwelexnpgzpzzfq.supabase.co/functions/v1'
          PUB='sb_publishable_10fnqdDQENO2LonzYDXIRw_kQ1q1utk'
          ACCOUNT=$(curl --fail --silent --show-error --max-time 25 "$BASE/account-auth")
          echo "$ACCOUNT" | grep -q '"zeroCost":true'
          echo "$ACCOUNT" | grep -q '"userIsolation":true'
          echo "$ACCOUNT" | grep -q '"mode":"username-password"'
          echo "$ACCOUNT" | grep -q '10+ chars, letter + number'
          echo "$ACCOUNT" | grep -q '"rateLimit":"ip+username"'
          echo "$ACCOUNT" | grep -q '"multiDevice":true'
          echo "$ACCOUNT" | grep -q '"cloudAutoUnlock":true'
          CONFIG=$(curl --fail --silent --show-error --max-time 25 "$BASE/app-config")
          echo "$CONFIG" | grep -q '"ok":true'
          echo "$CONFIG" | grep -q '"public":true'
          for fn in user-memory user-ai-key user-coach user-push user-privacy user-account user-photos admin-control admin-experience; do
            CODE=$(curl --silent --max-time 25 -o /tmp/dg-protected.json -w '%{http_code}' \
              -X POST -H "apikey: $PUB" -H 'Content-Type: application/json' \
              --data '{}' "$BASE/$fn")
            test "$CODE" = '401'
          done
      - name: Verify free shared services are alive
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rufnflwelexnpgzpzzfq.supabase.co/functions/v1'
          PUSH_DISP=$(curl --fail --silent --show-error --max-time 25 "$BASE/push-dispatch")
          FOOD=$(curl --fail --silent --show-error --max-time 25 "$BASE/food-lookup")
          echo "$PUSH_DISP" | grep -q '"ok":true'
          echo "$FOOD" | grep -q '"zeroCost":true'
          echo "$FOOD" | grep -q 'Open Food Facts v3'
