name: Dvir Gym AI Cloud Self-Test

on:
  push:
    paths:
      - '.github/workflows/dvir-gym-ai-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wait for Vercel production alias
        run: sleep 15
      - name: Call AI Gateway self-test
        shell: bash
        run: |
          set -euo pipefail
          URL="https://dvir-gym-ai-selftest-dvirs-projects-b157a454.vercel.app/api/selftest"
          BODY=$(curl -L --fail --silent --show-error --max-time 60 "$URL")
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true'
          echo "$BODY" | grep -q '"servedBy"'
