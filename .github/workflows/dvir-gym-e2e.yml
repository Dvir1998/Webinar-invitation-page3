name: Dvir Gym AI Browser E2E

on:
  push:
    branches: [main]
    paths:
      - 'gym/**'
      - '.github/workflows/dvir-gym-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve Athlete OS
        run: |
          python3 -m http.server 4173 --directory gym >/tmp/dvir-gym-http.log 2>&1 &
          echo $! > /tmp/dvir-gym-http.pid
          sleep 2
      - name: Run core multi-user E2E
        run: node gym/tests/e2e.mjs
      - name: Run scoped-storage E2E
        run: node gym/tests/multiuser-storage.mjs
      - name: Run AI home exercise visual E2E
        run: node gym/tests/home-visuals.mjs
      - name: Run authentic gym equipment library E2E
        run: node gym/tests/machine-library.mjs
      - name: Run light-theme accessibility and account-entry E2E
        run: node gym/tests/accessibility-account.mjs
