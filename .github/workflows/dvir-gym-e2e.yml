name: Dvir Gym AI Browser E2E

on:
  push:
    branches: [main]
    paths:
      - 'gym/**'
      - '.github/workflows/dvir-gym-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright browsers
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Serve Athlete OS
        run: |
          python3 -m http.server 4173 --directory gym >/tmp/dvir-gym-http.log 2>&1 &
          echo $! > /tmp/dvir-gym-http.pid
          sleep 2
      - name: Run core multi-user E2E
        run: |
          node gym/tests/e2e.mjs || {
            echo "Core E2E failed once; retrying in a fresh browser process"
            node gym/tests/e2e.mjs
          }
      - name: Run scoped-storage E2E
        run: node gym/tests/multiuser-storage.mjs
      - name: Run AI home exercise visual E2E
        run: node gym/tests/home-visuals.mjs
      - name: Run authentic gym equipment library E2E
        run: node gym/tests/machine-library.mjs
      - name: Verify 2x gym photos decode in the iPhone engine
        run: node gym/tests/gym-photo-decode.mjs
      - name: Run light-theme accessibility and account-entry E2E
        run: node gym/tests/accessibility-account.mjs
      - name: Run daily tracking and recovery nutrition E2E
        run: node gym/tests/daily-tracker-recovery.mjs
      - name: Run personal Gemini provider and secure vault E2E
        run: node gym/tests/ai-provider.mjs
      - name: Run first-paint visual stability E2E
        run: node gym/tests/visual-stability.mjs
      - name: Run trusted mobile scroll E2E in Chromium
        run: node gym/tests/mobile-scroll.mjs
      - name: Run iPhone engine scroll E2E in WebKit
        run: DG_BROWSER=webkit node gym/tests/mobile-scroll.mjs
