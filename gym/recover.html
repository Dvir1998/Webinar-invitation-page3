<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef8ff">
<title>Athlete OS Recovery</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 15%,#dff8ff,#eef8ff 48%,#f8f2ff);font-family:system-ui,-apple-system,sans-serif;color:#142236}.card{width:min(100%,520px);padding:26px;border:1px solid rgba(47,142,180,.22);border-radius:28px;background:rgba(255,255,255,.78);box-shadow:0 24px 70px rgba(50,85,120,.16);backdrop-filter:blur(24px);text-align:center}.orb{width:72px;height:72px;margin:0 auto 15px;display:grid;place-items:center;border-radius:24px;background:linear-gradient(135deg,#6feaff,#8ef3c8,#c7a7ff);font-size:30px;font-weight:900}.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.6px;color:#4d7590}.card h1{margin:7px 0 9px;font-size:28px}.card p{margin:0;color:#60758a;font-size:14px;line-height:1.65}.safe{margin:17px 0;padding:12px;border-radius:16px;background:#f2fbf7;color:#2e6d52;font-size:12px;font-weight:800}.actions{display:grid;gap:9px;margin-top:17px}button,a{width:100%;min-height:50px;border:0;border-radius:16px;font:800 14px system-ui;text-decoration:none;display:grid;place-items:center;cursor:pointer}.primary{background:linear-gradient(100deg,#64e8ff,#82efc2);color:#09212a}.ghost{background:#edf3f8;color:#314a60}.status{min-height:22px;margin-top:12px;font-size:12px;color:#64788d}
</style>
</head>
<body>
<main class="card">
 <div class="orb">↻</div>
 <div class="eyebrow">ATHLETE OS · SAFE RECOVERY</div>
 <h1>תיקון האפליקציה</h1>
 <p>התיקון מנקה רק קבצי Cache ו־Service Worker ישנים. החשבון, האימונים, הארוחות, המשקל, התמונות וההעדפות שלך לא נמחקים.</p>
 <div class="safe">✓ לא מוחקים נתונים אישיים</div>
 <div class="actions"><button class="primary" id="repair">תקן ופתח מחדש</button><a class="ghost" href="./?recovered=1">חזור בלי תיקון</a></div>
 <div class="status" id="status"></div>
</main>
<script>
async function repair(){
 const b=document.getElementById('repair'),s=document.getElementById('status');b.disabled=true;b.textContent='מתקן…';s.textContent='מנקה Cache ישן ומרענן את מנגנון ה־PWA';
 try{if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('dvir-athlete-os')).map(k=>caches.delete(k)))}}catch{}
 try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}}catch{}
 try{for(const k of Object.keys(localStorage))if(k.startsWith('dgReleaseAttemptV922:'))localStorage.removeItem(k);localStorage.setItem('dvirGymBootGuardV922',JSON.stringify({started:Date.now(),ready:true,count:0}))}catch{}
 s.textContent='הסתיים ✓ פותח Athlete OS נקי';
 setTimeout(()=>location.replace('./?recovered=1&cacheBust='+Date.now().toString(36)),500);
}
document.getElementById('repair').onclick=repair;
if(new URL(location.href).searchParams.get('auto')==='1')repair();
</script>
</body>
</html>
