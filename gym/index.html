<script>/* Identity + Theme Studio preboot: choose the user's scope and palette before first paint. */try{const SESSION='dvirGymAuthSessionV8',ACTIVE='dvirGymActiveScopeV8',PREFIX='dvirAthleteOS_v8::',LEGACY='dvirAthleteOS_v6',THEMES='dvirGymThemeV8::',COLORS={bright:'#eef8ff',cream:'#fbf3e6',pearl:'#fff8fa',aurora:'#f4fbff',night:'#05070b'};let s=null;try{s=JSON.parse(localStorage.getItem(SESSION)||'null')}catch{}const scope=s?.user?.id?'user:'+s.user.id:'guest';localStorage.setItem(ACTIVE,scope);let scoped=localStorage.getItem(PREFIX+scope),state=null;try{state=scoped?JSON.parse(scoped):null}catch{}const savedTheme=state?.prefs?.theme||localStorage.getItem(THEMES+scope)||localStorage.getItem('dvirGymThemeV1')||'bright',r=savedTheme==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'bright':'night'):(COLORS[savedTheme]?savedTheme:'bright');document.documentElement.dataset.dgTheme=r;document.documentElement.dataset.dgThemeChoice=savedTheme;document.querySelector('meta[name="theme-color"]')?.setAttribute('content',COLORS[r]||COLORS.bright);if(!scoped&&scope==='guest'){const legacy=localStorage.getItem(LEGACY);if(legacy){scoped=legacy;localStorage.setItem(PREFIX+'guest',legacy)}}if(scoped)localStorage.setItem(LEGACY,scoped);else{const display=s?.displayName||s?.user?.user_metadata?.full_name||'';localStorage.setItem(LEGACY,JSON.stringify({version:'8.0.0',appVersion:'8.0.0',profile:{name:display,age:'',sex:'',height:'',weight:'',targetWeight:'',goal:'lean_gain',days:4,activity:'medium',experience:'beginner',priority:[],injuries:'',dietStyle:'הכול',likes:'',dislikes:'',allergies:'',equipment:'',creatine:false,manualCalories:'',manualProtein:'',complete:false},prefs:{theme:savedTheme},logs:[],meals:[],weights:[],measures:[],chat:[],photos:[]}))}}catch{}</script>
